name: Actualizar licitaciones

# Finanzas publica el llamado dos días hábiles antes de la licitación, y el
# resultado la tarde o la noche del mismo día. GitHub atrasa las corridas
# programadas, a veces horas, y más las que caen en punto o y media: van en
# minutos sueltos. Dos a la tarde, dos a la noche —el resultado del 28/10/2026
# todavía no estaba a las 23:35— y una a la mañana, que levanta lo de la noche.
on:
  schedule:
    - cron: '17 11 * * 1-5'   # 08:17 ART
    - cron: '47 20 * * 1-5'   # 17:47 ART
    - cron: '23 22 * * 1-5'   # 19:23 ART
    - cron: '53 0 * * 2-6'    # 21:53 ART
    - cron: '41 2 * * 2-6'    # 23:41 ART
  workflow_dispatch:
    inputs:
      desde:
        description: 'Rearmar el historial desde (YYYY-MM-DD); vacío = sólo lo reciente'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  licitaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sólo biblioteca estándar: no hay nada que instalar.
      - name: Leer cronograma, resultados y llamado
        env:
          DESDE: ${{ github.event.inputs.desde }}
        run: |
          if [ -n "$DESDE" ]; then
            python .github/scripts/licitaciones.py --desde "$DESDE"
          else
            python .github/scripts/licitaciones.py
          fi

      # El script no reescribe el archivo cuando sólo cambiaría el sello de
      # tiempo: "sin cambios" acá es que no hubo llamado ni resultado nuevo.
      - name: Commitear si cambió
        run: |
          if git diff --quiet -- licitaciones.json; then
            echo "Sin novedades."
            exit 0
          fi
          ultima=$(python -c "import json;d=json.load(open('licitaciones.json',encoding='utf-8'));print(d['licitaciones'][-1]['fecha'] if d['licitaciones'] else '')")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add licitaciones.json
          git commit -m "data(licitaciones): al ${ultima}"
          git push
