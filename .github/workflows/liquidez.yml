name: Actualizar liquidez

# El MAE publica el REPO de la rueda al cierre. GitHub corre los horarios
# programados con demoras de horas, así que hay dos pasadas a la tarde y una a
# la mañana siguiente por si las dos fallan. Van a minutos sueltos porque las
# tareas en punto son las que más se demoran.
on:
  schedule:
    - cron: '37 21 * * 1-5'   # 18:37 ART
    - cron: '57 23 * * 1-5'   # 20:57 ART
    - cron: '27 11 * * 1-5'   # 08:27 ART
  workflow_dispatch:
    inputs:
      desde:
        description: 'Rearmar la historia desde (YYYY-MM-DD); vacío = sólo lo reciente'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  liquidez:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sólo biblioteca estándar: no hay nada que instalar.
      - name: Leer el REPO del MAE
        env:
          DESDE: ${{ github.event.inputs.desde }}
        run: |
          if [ -n "$DESDE" ]; then
            python .github/scripts/liquidez.py --desde "$DESDE"
          else
            python .github/scripts/liquidez.py
          fi

      - name: Commitear si cambió
        run: |
          if git diff --quiet -- liquidez.json; then
            echo "Sin novedades."
            exit 0
          fi
          ultima=$(python -c "import json;d=json.load(open('liquidez.json',encoding='utf-8'));print(d['ruedas'][-1][0] if d['ruedas'] else '')")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liquidez.json
          git commit -m "data(liquidez): al ${ultima}"
          git push
