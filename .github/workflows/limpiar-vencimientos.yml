name: Listar ruedas pegadas al vencimiento

# Lista las filas del histórico a menos de CURVAS_DIAS_MIN días del vencimiento
# y deja el SQL para sacarlas. No borra: la tabla no tiene policy de DELETE a
# propósito. La app ya no las lee y ninguna de las rutas que escriben historia
# las genera; esto es para limpiarlas también de la tabla.
on:
  workflow_dispatch:

jobs:
  limpiar:
    name: Listar y generar el SQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install playwright && npx playwright install --with-deps chromium

      - run: node .github/scripts/limpiar-vencimientos.js
        env:
          SUPABASE_BOT_EMAIL: ${{ secrets.SUPABASE_BOT_EMAIL }}
          SUPABASE_BOT_PASSWORD: ${{ secrets.SUPABASE_BOT_PASSWORD }}

      - name: Publicar el SQL como artifact
        uses: actions/upload-artifact@v4
        with:
          name: limpiar-vencimientos-sql
          path: supabase/limpiar-vencimientos.sql
          if-no-files-found: ignore
